[package]
name = "prime"
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/VachaganGrigoryan/prime"
publish = false
default-run = "prime-coordinator"
autobins = false

[lib]
name = "prime_finder"

[[bin]]
name = "prime-finder"
path = "src/main.rs"
required-features = ["coordinator"]

[[bin]]
name = "prime-coordinator"
path = "src/coordinator.rs"
required-features = ["coordinator"]

[[bin]]
name = "prime"
path = "src/bin/prime.rs"
required-features = ["volunteer-worker"]

[[bin]]
name = "prime-worker"
path = "src/bin/prime-worker.rs"
required-features = ["volunteer-worker"]

[features]
default = ["coordinator"]
coordinator = [
    "dep:axum", "dep:getrandom", "dep:libc", "dep:rusqlite", "dep:tokio-stream",
    "dep:tower-http", "dep:ring", "reqwest/rustls", "reqwest/stream",
]
volunteer-worker = ["dep:axum", "dep:getrandom", "dep:rpassword", "reqwest/rustls"]

[dependencies]
axum = { version = "=0.8.9", optional = true }
base64 = "=0.22.1"
clap = { version = "=4.6.9", features = ["derive"] }
getrandom = { version = "=0.4.3", optional = true }
libc = { version = "=0.2.191", optional = true }
reqwest = { version = "=0.13.5", default-features = false, features = ["json"] }
ring = { version = "=0.17.14", optional = true }
rpassword = { version = "=7.4.0", optional = true }
rusqlite = { version = "=0.38.0", optional = true }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
tokio = { version = "=1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "time", "sync", "fs", "io-util"] }
tokio-stream = { version = "=0.1.19", optional = true }
tower-http = { version = "=0.6.11", features = ["fs"], optional = true }

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }
