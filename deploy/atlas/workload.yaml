# The Test Math web deployment proxies public reads through the archive Service.
# Mac workers and administrators connect through the private SSH forward on 8787.
apiVersion: v1
kind: Namespace
metadata:
  name: dev-prime-finder
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-prime-finder-coordinator
  labels: {app.kubernetes.io/name: prime-finder, app.kubernetes.io/component: coordinator}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: prime-finder, app.kubernetes.io/component: coordinator}
  template:
    metadata:
      labels: {app.kubernetes.io/name: prime-finder, app.kubernetes.io/component: coordinator}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: coordinator
          image: prime-finder:lab-v6
          imagePullPolicy: IfNotPresent
          args: [serve, --bind, "0.0.0.0:8787", --public-bind, "0.0.0.0:8788", --archive-dir, /archive, --web-root, /app/web, --mount-id, prime-finder-atlas-v1]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 250m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          envFrom:
            - secretRef: {name: prime-finder-env}
          ports:
            - {name: http, containerPort: 8787, hostPort: 8787, hostIP: 127.0.0.1}
            - {name: public-http, containerPort: 8788}
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 2}
          volumeMounts:
            - {name: archive, mountPath: /archive}
      volumes:
        - name: archive
          hostPath: {path: /NAS/dev/prime-finder/storage, type: Directory}
---
apiVersion: v1
kind: Service
metadata:
  name: dev-prime-finder-coordinator
  labels: {app.kubernetes.io/name: prime-finder, app.kubernetes.io/component: coordinator}
spec:
  selector: {app.kubernetes.io/name: prime-finder, app.kubernetes.io/component: coordinator}
  ports:
    - {name: http, port: 8787, targetPort: http}
    - {name: archive-http, port: 8788, targetPort: public-http}
