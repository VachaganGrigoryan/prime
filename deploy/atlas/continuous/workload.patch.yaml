# prime-api.notallow.cc -> 127.0.0.1:8789
# prime-admin.notallow.cc -> 127.0.0.1:8792 (Cloudflare Access)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-prime-finder-coordinator
  namespace: dev-prime-finder
spec:
  template:
    spec:
      containers:
        - name: coordinator
          image: prime:0.2.0-brand-20261124-1
          args:
            - serve
            - --bind
            - 0.0.0.0:8787
            - --public-bind
            - 0.0.0.0:8788
            - --mining-bind
            - 0.0.0.0:8789
            - --admin-bind
            - 0.0.0.0:8792
            - --archive-dir
            - /archive
            - --mount-id
            - prime-finder-atlas-v1
          envFrom:
            - secretRef: {name: prime-finder-env}
            - secretRef: {name: prime-continuous-env}
          ports:
            - {name: prime-api, containerPort: 8789, hostPort: 8789, hostIP: 127.0.0.1}
            - {name: prime-admin, containerPort: 8792, hostPort: 8792, hostIP: 127.0.0.1}
