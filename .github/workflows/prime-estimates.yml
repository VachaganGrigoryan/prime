name: Score published prime predictions

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write
  pages: write

concurrency:
  group: prime-estimates-pages
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: gh-pages
          path: pages
      - name: Score verified windows
        run: |
          python3 -m venv "$RUNNER_TEMP/prime-math"
          "$RUNNER_TEMP/prime-math/bin/pip" install mpmath==1.3.0
          "$RUNNER_TEMP/prime-math/bin/python" scripts/publish_prime_score.py pages "$(git -C pages rev-parse HEAD)"
      - name: Record updated public score
        working-directory: pages
        run: |
          git add -- prime-score.json
          if ! git diff --cached --quiet; then
            git -c user.name='Prime estimates' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Score the published prime prediction'
            git push origin HEAD:gh-pages
          fi
      - name: Request the branch-source Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          built=$(gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" --jq 'select(.status != "errored") | .commit')
          if [ "$built" != "$(git -C pages rev-parse HEAD)" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
          fi
